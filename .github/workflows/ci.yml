name: CI

# 这里**只**跑零依赖测试。
#
# 本项目真正的功能是「Keil C51 编译 → Proteus 仿真 → 确定性判定」，它需要在本机装好
# Keil C51 与 Proteus ISIS（两者都是商业软件，runner 上没有），并且链路中间还有三个
# 不在本仓库内的脚本（build51.py / proteus_ctl.py / verify.py）。所以本工作流
# **不假装**跑过编译或仿真：端到端只能由使用者在自己的机器上自验，方法见 README 的「测试」一节。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  zero-dependency:
    name: 零依赖测试（不含 Keil / Proteus 路径，node ${{ matrix.node-version }}）
    # 用 ubuntu 而不是 windows：这个作业要真跑「SDCC 编译 → 离线确定性判定」，
    # 而 SDCC 在 Windows runner 上没有干净来源（winget / chocolatey / conda-forge 均无包，
    # 官网只发安装器），ubuntu 的 apt 里有。内核对 DSN 的离线判定本身是纯字符串判定、
    # 不碰 Win32；只有读 ISIS 窗口那部分才需要 Windows，而它本来就不属于本作业。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 测试里的内核命令行契约与纯函数部分需要 Python 3，显式装一个，不靠 runner 碰运气
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 装免费的 SDCC。不装它，「SDCC 可将自带示例编译为 hex/ihx」与
      # 「mcu_lab run 真实串起 SDCC 编译与离线判定」两项就只能报"未找到可用编译器"而失败——
      # 那是环境缺失，不是本项目坏了；装上它这两项才是真验证。
      - name: 装 SDCC（8051 免费编译器）
        run: sudo apt-get update && sudo apt-get install -y sdcc

      - name: 跑测试
        run: node test.mjs
